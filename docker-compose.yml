version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civicflow-postgres
    environment:
      POSTGRES_DB: civicflow_db
      POSTGRES_USER: civicflow_user
      POSTGRES_PASSWORD: civicflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow_user -d civicflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicflow-backend
    environment:
      - DATABASE_URL=postgresql://civicflow_user:civicflow_password@postgres:5432/civicflow_db
      - SECRET_KEY=civicflow-super-secret-jwt-key-sih2026-production-ready
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
